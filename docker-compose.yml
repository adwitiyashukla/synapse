services:
  synapse:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/synapse.db
      - CHROMA_DIR=/app/data/chroma
    volumes:
      - synapse-data:/app/data
    restart: unless-stopped

volumes:
  synapse-data:
